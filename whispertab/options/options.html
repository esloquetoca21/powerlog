<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WhisperTab - Configuración</title>
  <style>
    /* ============================================================
       Estilos de la página de opciones
       ============================================================ */
    :root {
      --color-bg: #1a1a2e;
      --color-surface: #16213e;
      --color-primary: #0f3460;
      --color-accent: #e94560;
      --color-text: #eee;
      --color-text-muted: #8892b0;
      --color-success: #64ffda;
      --color-border: #233554;
      --radius: 8px;
      --font: "Segoe UI", system-ui, -apple-system, sans-serif;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--font);
      background: var(--color-bg);
      color: var(--color-text);
      display: flex;
      justify-content: center;
      padding: 40px 20px;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 500px;
    }

    h1 {
      font-size: 1.6rem;
      margin-bottom: 8px;
    }

    .subtitle {
      color: var(--color-text-muted);
      font-size: 0.9rem;
      margin-bottom: 32px;
    }

    .form-group {
      margin-bottom: 24px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--color-text-muted);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .label-hint {
      display: block;
      font-size: 0.75rem;
      font-weight: 400;
      color: var(--color-text-muted);
      margin-top: 2px;
      text-transform: none;
      letter-spacing: 0;
    }

    input[type="password"],
    select {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      background: var(--color-surface);
      color: var(--color-text);
      font-size: 0.9rem;
      font-family: var(--font);
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="password"]:focus,
    select:focus {
      border-color: var(--color-accent);
    }

    select {
      cursor: pointer;
    }

    select option {
      background: var(--color-surface);
      color: var(--color-text);
    }

    .btn-save {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: var(--radius);
      background: var(--color-accent);
      color: white;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-save:hover {
      background: #c73a52;
    }

    .message {
      margin-top: 16px;
      padding: 12px;
      border-radius: var(--radius);
      font-size: 0.85rem;
      display: none;
    }

    .message--success {
      display: block;
      background: rgba(100, 255, 218, 0.1);
      border: 1px solid var(--color-success);
      color: var(--color-success);
    }

    .message--error {
      display: block;
      background: rgba(255, 107, 107, 0.1);
      border: 1px solid #ff6b6b;
      color: #ff6b6b;
    }

    .info-box {
      margin-top: 32px;
      padding: 16px;
      border-radius: var(--radius);
      background: var(--color-surface);
      border: 1px solid var(--color-border);
    }

    .info-box h3 {
      font-size: 0.9rem;
      margin-bottom: 8px;
    }

    .info-box p {
      font-size: 0.8rem;
      color: var(--color-text-muted);
      line-height: 1.6;
    }

    .info-box a {
      color: var(--color-accent);
      text-decoration: none;
    }

    .info-box a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>⚙️ Configuración de WhisperTab</h1>
    <p class="subtitle">Configura tus API Keys y preferencias</p>

    <form id="options-form">
      <!-- Groq API Key -->
      <div class="form-group">
        <label for="groq-key">
          Groq API Key
          <span class="label-hint">Necesaria para el modo Diferido (Whisper)</span>
        </label>
        <input
          type="password"
          id="groq-key"
          placeholder="gsk_..."
          autocomplete="off"
        >
      </div>

      <!-- Claude API Key -->
      <div class="form-group">
        <label for="claude-key">
          Claude API Key (Anthropic)
          <span class="label-hint">Necesaria para generar resúmenes con IA</span>
        </label>
        <input
          type="password"
          id="claude-key"
          placeholder="sk-ant-..."
          autocomplete="off"
        >
      </div>

      <!-- Idioma -->
      <div class="form-group">
        <label for="language">
          Idioma de transcripción
          <span class="label-hint">Idioma principal del audio que vas a transcribir</span>
        </label>
        <select id="language">
          <option value="es">Español</option>
          <option value="en">Inglés</option>
          <option value="auto">Automático (detectar)</option>
        </select>
      </div>

      <!-- Botón guardar -->
      <button type="submit" class="btn-save">💾 Guardar configuración</button>

      <!-- Mensaje de estado -->
      <div id="status-message" class="message"></div>
    </form>

    <!-- Información de ayuda -->
    <div class="info-box">
      <h3>📖 ¿Dónde consigo las API Keys?</h3>
      <p>
        <strong>Groq:</strong> Regístrate gratis en
        <a href="https://console.groq.com" target="_blank">console.groq.com</a>
        y crea una API Key en la sección "API Keys".
        <br><br>
        <strong>Claude (Anthropic):</strong> Regístrate en
        <a href="https://console.anthropic.com" target="_blank">console.anthropic.com</a>
        y genera una API Key en "Settings > API Keys".
      </p>
    </div>
  </div>

  <script src="options.js"></script>
</body>
</html>
