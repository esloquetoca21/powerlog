<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 460">
  <!-- Body silhouette base (back view) -->
  <g id="body_silhouette">
    <!-- Head -->
    <circle cx="100" cy="38" r="24" fill="#1A1A1A" stroke="#3A3A3A" stroke-width="1.2"/>
    <!-- Neck -->
    <rect x="92" y="60" width="16" height="18" rx="3" fill="#1A1A1A"/>
    <!-- Torso (back) -->
    <path d="M58,78 Q48,85 44,100 L42,180 Q42,195 48,205 L50,238 Q54,248 60,252 L68,268 L132,268 L140,252 Q146,248 150,238 L152,205 Q158,195 158,180 L156,100 Q152,85 142,78 Z" fill="#1A1A1A" stroke="#3A3A3A" stroke-width="1.2"/>
    <!-- Left upper arm (back) -->
    <path d="M58,82 Q42,88 36,105 L33,145 Q32,158 36,170 L40,178 L56,168 L58,130 L60,90 Z" fill="#1A1A1A" stroke="#3A3A3A" stroke-width="1"/>
    <!-- Right upper arm (back) -->
    <path d="M142,82 Q158,88 164,105 L167,145 Q168,158 164,170 L160,178 L144,168 L142,130 L140,90 Z" fill="#1A1A1A" stroke="#3A3A3A" stroke-width="1"/>
    <!-- Left forearm (back) -->
    <path d="M34,178 L38,178 L52,172 L58,180 L56,232 Q54,248 50,258 L44,265 L36,262 Q30,254 30,244 L30,210 Q30,192 34,178 Z" fill="#1A1A1A" stroke="#3A3A3A" stroke-width="1"/>
    <!-- Right forearm (back) -->
    <path d="M166,178 L162,178 L148,172 L142,180 L144,232 Q146,248 150,258 L156,265 L164,262 Q170,254 170,244 L170,210 Q170,192 166,178 Z" fill="#1A1A1A" stroke="#3A3A3A" stroke-width="1"/>
    <!-- Left hand (back) -->
    <ellipse cx="43" cy="272" rx="9" ry="11" fill="#1A1A1A" stroke="#3A3A3A" stroke-width="1"/>
    <!-- Right hand (back) -->
    <ellipse cx="157" cy="272" rx="9" ry="11" fill="#1A1A1A" stroke="#3A3A3A" stroke-width="1"/>
    <!-- Hips (back) -->
    <path d="M60,252 L58,268 L68,280 L94,284 L106,284 L132,280 L142,268 L140,252 Q100,262 60,252 Z" fill="#1A1A1A"/>
    <!-- Left upper leg (back) -->
    <path d="M68,280 L58,268 L54,320 L56,358 L64,362 L78,360 L84,330 L88,284 L94,284 Z" fill="#1A1A1A" stroke="#3A3A3A" stroke-width="1"/>
    <!-- Right upper leg (back) -->
    <path d="M132,280 L142,268 L146,320 L144,358 L136,362 L122,360 L116,330 L112,284 L106,284 Z" fill="#1A1A1A" stroke="#3A3A3A" stroke-width="1"/>
    <!-- Left lower leg (back) -->
    <path d="M56,360 L62,362 L78,360 L80,395 Q80,420 76,436 L68,440 L60,436 Q56,420 56,395 Z" fill="#1A1A1A" stroke="#3A3A3A" stroke-width="1"/>
    <!-- Right lower leg (back) -->
    <path d="M144,360 L138,362 L122,360 L120,395 Q120,420 124,436 L132,440 L140,436 Q144,420 144,395 Z" fill="#1A1A1A" stroke="#3A3A3A" stroke-width="1"/>
    <!-- Left foot (back) -->
    <ellipse cx="68" cy="443" rx="11" ry="6" fill="#1A1A1A" stroke="#3A3A3A" stroke-width="1"/>
    <!-- Right foot (back) -->
    <ellipse cx="132" cy="443" rx="11" ry="6" fill="#1A1A1A" stroke="#3A3A3A" stroke-width="1"/>
  </g>

  <!-- Trapecio - upper back / neck area -->
  <path id="trapecio" d="M82,62 Q100,58 118,62 L132,82 Q116,90 100,92 Q84,90 68,82 Z" fill="#2C2C2C"/>

  <!-- Trapecio Inferior - mid-trapezius -->
  <path id="trapecio_inferior" d="M72,108 Q86,100 100,102 Q114,100 128,108 L124,140 Q112,132 100,134 Q88,132 76,140 Z" fill="#2C2C2C"/>

  <!-- Deltoides Lateral - side shoulder, both sides -->
  <g id="deltoides_lateral">
    <ellipse cx="52" cy="100" rx="10" ry="14" fill="#2C2C2C"/>
    <ellipse cx="148" cy="100" rx="10" ry="14" fill="#2C2C2C"/>
  </g>

  <!-- Deltoides Posterior - rear shoulder, both sides -->
  <g id="deltoides_posterior">
    <ellipse cx="56" cy="88" rx="9" ry="11" fill="#2C2C2C"/>
    <ellipse cx="144" cy="88" rx="9" ry="11" fill="#2C2C2C"/>
  </g>

  <!-- Romboides - upper mid-back between shoulder blades -->
  <path id="romboides" d="M82,96 Q100,90 118,96 L116,124 Q100,118 84,124 Z" fill="#2C2C2C"/>

  <!-- Dorsales - large back muscle, both sides -->
  <g id="dorsales">
    <path d="M62,118 L80,110 L80,190 Q72,210 66,228 L58,234 Q52,218 52,196 L52,155 Q52,134 62,118 Z" fill="#2C2C2C"/>
    <path d="M138,118 L120,110 L120,190 Q128,210 134,228 L142,234 Q148,218 148,196 L148,155 Q148,134 138,118 Z" fill="#2C2C2C"/>
  </g>

  <!-- Triceps - back of upper arm, both sides -->
  <g id="tríceps">
    <ellipse cx="43" cy="130" rx="9" ry="24" fill="#2C2C2C"/>
    <ellipse cx="157" cy="130" rx="9" ry="24" fill="#2C2C2C"/>
  </g>

  <!-- Antebrazos - forearm back, both sides -->
  <g id="antebrazos">
    <ellipse cx="43" cy="218" rx="8" ry="20" fill="#2C2C2C"/>
    <ellipse cx="157" cy="218" rx="8" ry="20" fill="#2C2C2C"/>
  </g>

  <!-- Erectores - lower back, vertical columns -->
  <g id="erectores">
    <rect x="88" y="180" width="9" height="58" rx="4" fill="#2C2C2C"/>
    <rect x="103" y="180" width="9" height="58" rx="4" fill="#2C2C2C"/>
  </g>

  <!-- Gluteos - buttocks, both sides -->
  <g id="glúteos">
    <path d="M68,260 L95,258 L95,292 Q88,306 78,308 Q67,306 61,294 L60,274 Z" fill="#2C2C2C"/>
    <path d="M132,260 L105,258 L105,292 Q112,306 122,308 Q133,306 139,294 L140,274 Z" fill="#2C2C2C"/>
  </g>

  <!-- Gluteo Medio - outer hip area, both sides -->
  <g id="glúteo_medio">
    <ellipse cx="59" cy="258" rx="8" ry="11" fill="#2C2C2C"/>
    <ellipse cx="141" cy="258" rx="8" ry="11" fill="#2C2C2C"/>
  </g>

  <!-- Isquiotibiales - back of thigh, both sides -->
  <g id="isquiotibiales">
    <path d="M62,308 L88,308 L86,354 L78,360 L62,356 L57,330 L58,312 Z" fill="#2C2C2C"/>
    <path d="M138,308 L112,308 L114,354 L122,360 L138,356 L143,330 L142,312 Z" fill="#2C2C2C"/>
  </g>

  <!-- Gastrocnemio - calf upper, both sides -->
  <g id="gastrocnemio">
    <path d="M60,364 L76,362 L78,390 Q72,400 68,402 Q64,400 60,390 Z" fill="#2C2C2C"/>
    <path d="M140,364 L124,362 L122,390 Q128,400 132,402 Q136,400 140,390 Z" fill="#2C2C2C"/>
  </g>

  <!-- Soleo - calf lower, both sides -->
  <g id="sóleo">
    <path d="M60,390 Q64,400 68,402 Q72,400 78,390 L78,426 L68,432 L60,428 Z" fill="#2C2C2C"/>
    <path d="M140,390 Q136,400 132,402 Q128,400 122,390 L122,426 L132,432 L140,428 Z" fill="#2C2C2C"/>
  </g>
</svg>
